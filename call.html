<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wavr — Call</title>
<meta name="theme-color" content="#F97316"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Wavr"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
  html,body{height:100dvh;overflow:hidden}
  body{background:#000}

  /* ── RADIAL GLOW BG ── */
  #bg-glow{
    position:fixed;inset:0;
    background:radial-gradient(ellipse 80% 60% at 50% 60%, rgba(249,115,22,.09) 0%, transparent 65%);
    animation:glow 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}

  /* waveform canvas behind */
  #call-canvas{
    position:fixed;bottom:0;left:0;right:0;height:200px;
    opacity:0;pointer-events:none;transition:opacity .8s;
  }
  #call-canvas.live{opacity:.2}

  /* ── TOP BAR ── */
  .call-top{
    position:fixed;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;z-index:20;
    opacity:0;animation:fadeIn .6s ease .3s forwards;
  }
  .back-btn{
    display:flex;align-items:center;gap:6px;
    background:none;border:none;color:var(--muted2);
    font-size:.82rem;font-family:var(--fb);cursor:pointer;
    transition:color .18s;padding:0;
  }
  .back-btn:hover{color:var(--white)}
  .quality-pill{
    display:flex;align-items:center;gap:7px;
    padding:5px 12px;border-radius:100px;
    background:rgba(255,255,255,.04);border:1px solid var(--border);
    font-family:var(--fm);font-size:.65rem;color:var(--muted2);
    opacity:0;transition:opacity .5s;
  }
  .quality-pill.on{opacity:1}
  .q-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:wave 2s ease-in-out infinite}

  /* ── CALL CENTER ── */
  .call-center{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;padding:20px;
  }

  /* avatar with glow rings */
  .ava-zone{
    position:relative;display:flex;align-items:center;justify-content:center;
    margin-bottom:32px;
  }
  .ring{
    position:absolute;border-radius:50%;border:1.5px solid rgba(249,115,22,.35);
    animation:pulseR 2.8s ease-out infinite;
  }
  .ring-1{width:130px;height:130px;animation-delay:0s}
  .ring-2{width:170px;height:170px;animation-delay:.7s}
  .ring-3{width:210px;height:210px;animation-delay:1.4s}

  /* name */
  .call-status-lbl{
    font-family:var(--fm);font-size:.65rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);
    margin-bottom:10px;text-align:center;
    opacity:0;animation:fadeIn .6s ease .5s forwards;
  }
  .call-name{
    font-family:var(--fd);font-size:clamp(2rem,8vw,2.8rem);
    font-weight:800;letter-spacing:-.04em;
    text-align:center;
    margin-bottom:10px;
    max-width:100%;overflow-wrap:break-word;word-break:break-word;
    opacity:0;animation:fadeUp .7s ease .4s forwards;
  }
  .call-addr{
    font-family:var(--fm);font-size:.72rem;color:var(--muted);
    text-align:center;margin-bottom:28px;
    opacity:0;animation:fadeIn .6s ease .6s forwards;
  }

  /* connecting / timer */
  #conn-state{
    display:flex;align-items:center;gap:10px;
    font-size:.85rem;color:var(--muted2);
    margin-bottom:28px;
    opacity:0;animation:fadeIn .6s ease .7s forwards;
  }
  .cdots{display:flex;gap:5px}
  .cd{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:connDot 1.4s ease-in-out infinite}
  .cd:nth-child(2){animation-delay:.16s}
  .cd:nth-child(3){animation-delay:.32s}
  @keyframes connDot{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

  #live-state{display:none;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px}
  #live-state.on{display:flex;animation:fadeIn .5s ease}
  #timer{
    font-family:var(--fd);font-size:1.4rem;font-weight:700;
    color:var(--acc);letter-spacing:.08em;
  }

  /* wave bars */
  .live-bars{display:flex;align-items:center;gap:3px;height:22px}
  .live-bar{width:3px;border-radius:3px;background:var(--acc);animation:wave 1.1s ease-in-out infinite}
  .live-bar:nth-child(1){height:30%;animation-delay:0s}
  .live-bar:nth-child(2){height:65%;animation-delay:.1s}
  .live-bar:nth-child(3){height:100%;animation-delay:.2s}
  .live-bar:nth-child(4){height:65%;animation-delay:.3s}
  .live-bar:nth-child(5){height:40%;animation-delay:.12s}

  /* ── CONTROLS ── */
  .controls{
    position:fixed;bottom:0;left:0;right:0;
    padding:28px 24px calc(44px + env(safe-area-inset-bottom, 0px));
    display:flex;align-items:flex-end;justify-content:center;gap:20px;
    opacity:0;animation:fadeUp .7s ease .6s forwards;
  }
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:8px}
  .ctrl-lbl{font-family:var(--fm);font-size:.62rem;color:var(--muted);letter-spacing:.06em}

  #end-btn{
    width:68px;height:68px;border-radius:50%;
    background:var(--danger);border:none;color:#fff;
    font-size:1.5rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s;
    animation:glow2 2.5s ease-in-out infinite;
  }
  @keyframes glow2{0%,100%{box-shadow:0 0 20px rgba(239,68,68,.4)}50%{box-shadow:0 0 40px rgba(239,68,68,.7)}}
  #end-btn:hover{background:#dc2626;transform:scale(1.06)}
  #end-btn:active{transform:scale(.95)}

  .ctrl-btn{
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.05);border:1px solid var(--border);
    color:var(--muted2);font-size:1.1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s;
  }
  .ctrl-btn:hover{border-color:var(--acc);color:var(--acc)}
  .ctrl-btn.on{background:var(--a10);border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>

<div id="bg-glow"></div>
<canvas id="call-canvas"></canvas>

<!-- top bar -->
<div class="call-top">
  <button class="back-btn" id="back-btn">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Back
  </button>
  <div class="quality-pill" id="qpill">
    <div class="q-dot"></div>
    P2P · Solana
  </div>
</div>

<!-- center -->
<div class="call-center">
  <!-- avatar rings -->
  <div class="ava-zone" id="ava-zone">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="ava ava-xl" id="call-ava" style="position:relative;z-index:2">?</div>
  </div>

  <div class="call-status-lbl" id="dir-lbl">Calling</div>
  <div class="call-name" id="call-name">—</div>
  <div class="call-addr" id="call-addr">—</div>

  <!-- connecting state -->
  <div id="conn-state">
    <div class="cdots">
      <div class="cd"></div><div class="cd"></div><div class="cd"></div>
    </div>
    <span>Connecting</span>
  </div>

  <!-- live state -->
  <div id="live-state">
    <div class="live-bars">
      <div class="live-bar"></div>
      <div class="live-bar"></div>
      <div class="live-bar"></div>
      <div class="live-bar"></div>
      <div class="live-bar"></div>
    </div>
    <div id="timer">00:00</div>
  </div>
</div>

<!-- controls -->
<div class="controls">
  <div class="ctrl">
    <button class="ctrl-btn" id="mute-btn">
      <svg width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
    </button>
    <span class="ctrl-lbl" id="mute-lbl">Mute</span>
  </div>

  <div class="ctrl">
    <button id="end-btn">
      <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"/></svg>
    </button>
    <span class="ctrl-lbl">End call</span>
  </div>

  <div class="ctrl">
    <button class="ctrl-btn" id="spk-btn">
      <svg width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M12 6a7.975 7.975 0 015.657 2.343m0 0A7.975 7.975 0 0120 12m-2.343 5.657A7.975 7.975 0 0112 18m0-12v12"/></svg>
    </button>
    <span class="ctrl-lbl" id="spk-lbl">Speaker</span>
  </div>
</div>

<audio id="remote-audio" autoplay></audio>
<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/signaling.js"></script>
<script src="js/webrtc.js"></script>
<script>
  const token       = localStorage.getItem('wavr_token')
  const myAddress   = localStorage.getItem('wavr_address')
  const myUsername  = localStorage.getItem('wavr_username')
  const peerAddress = sessionStorage.getItem('call_peer_address')
  const peerName    = sessionStorage.getItem('call_peer_username')
  const peerAvatar  = sessionStorage.getItem('call_peer_avatar')
  const direction   = sessionStorage.getItem('call_direction')
  const savedOffer  = sessionStorage.getItem('call_offer')

  if(!token || !myAddress || !peerAddress) window.location.href = 'app.html'

  // UI setup
  const callAva = document.getElementById('call-ava')
  callAva.textContent = (peerName||'?').charAt(0).toUpperCase()

  if(peerAvatar){
    const img = document.createElement('img')
    img.src = peerAvatar
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;inset:0;z-index:1'
    img.onerror = () => img.remove()
    callAva.style.position = 'relative'
    callAva.appendChild(img)
  }

  document.getElementById('call-name').textContent = '@'+(peerName||peerAddress.slice(0,8))
  document.getElementById('call-addr').textContent = peerAddress.slice(0,6)+'…'+peerAddress.slice(-4)
  document.getElementById('dir-lbl').textContent   = direction === 'incoming' ? 'Incoming from' : 'Calling'

  // ── GSAP ENTRANCE ──
  gsap.fromTo('.ava-zone', {scale:.7, opacity:0}, {scale:1, opacity:1, duration:.9, ease:'elastic.out(1,.6)', delay:.1})
  gsap.fromTo('.ring',     {scale:0, opacity:0}, {scale:1, opacity:1, duration:.6, stagger:.12, ease:'back.out(1.4)', delay:.3})

  // ── WAVEFORM CANVAS ──
  const canvas = document.getElementById('call-canvas')
  const ctx    = canvas.getContext('2d')
  let wt = 0, waveRunning = false

  function resizeCv(){ canvas.width = window.innerWidth; canvas.height = 200 }
  resizeCv(); window.addEventListener('resize', resizeCv)

  function drawCallWave(){
    if(!waveRunning) return
    ctx.clearRect(0,0,canvas.width,canvas.height)
    const W=canvas.width,H=canvas.height
    ;[{amp:40,freq:.01,sp:.015,off:0,a:.9},{amp:22,freq:.017,sp:.022,off:2,a:.5},{amp:13,freq:.027,sp:.01,off:4,a:.3}].forEach(w=>{
      ctx.beginPath()
      ctx.moveTo(0,H)
      for(let x=0;x<=W;x+=2){
        const y=H*.6+Math.sin(x*w.freq+wt*w.sp+w.off)*w.amp+Math.sin(x*w.freq*1.6+wt*w.sp*.7)*w.amp*.35
        ctx.lineTo(x,y)
      }
      ctx.lineTo(W,H);ctx.closePath()
      const g=ctx.createLinearGradient(0,0,0,H)
      g.addColorStop(0,`rgba(249,115,22,${w.a})`)
      g.addColorStop(1,'rgba(249,115,22,0)')
      ctx.fillStyle=g;ctx.fill()
    })
    wt++
    requestAnimationFrame(drawCallWave)
  }

  // ── CONNECTED ──
  let timerSec=0, timerInterval=null, muted=false

  function onConnected(){
    document.getElementById('conn-state').style.display = 'none'
    document.getElementById('live-state').classList.add('on')
    document.getElementById('qpill').classList.add('on')
    document.getElementById('call-canvas').classList.add('live')
    waveRunning = true; drawCallWave()

    // Remove pulse rings, keep avatar bold
    document.querySelectorAll('.ring').forEach(r=>r.style.animationDuration='4s')
    gsap.to('#bg-glow',{opacity:1.5,duration:1})

    timerInterval = setInterval(()=>{
      timerSec++
      const m=String(Math.floor(timerSec/60)).padStart(2,'0')
      const s=String(timerSec%60).padStart(2,'0')
      document.getElementById('timer').textContent = m+':'+s
    },1000)
  }

  // ── MUTE ──
  document.getElementById('mute-btn').addEventListener('click',function(){
    muted=!muted; toggleMute(muted)
    this.classList.toggle('on',muted)
    document.getElementById('mute-lbl').textContent=muted?'Unmuted':'Mute'
  })

  // ── SPEAKER ──
  // Routes audio output via HTMLMediaElement.setSinkId — supported on desktop
  // Chrome/Edge and Android Chrome, NOT on Safari/iOS (no web API exists there
  // to force loudspeaker; iOS handles that at the OS level). We detect support
  // up front and disable the control with an explanation rather than fake it.
  ;(function initSpeakerToggle(){
    const spkBtn = document.getElementById('spk-btn')
    const spkLbl = document.getElementById('spk-lbl')
    const remoteAudio = document.getElementById('remote-audio')
    const sinkSupported = typeof remoteAudio.setSinkId === 'function'

    if(!sinkSupported){
      spkBtn.style.opacity = '.4'
      spkBtn.style.cursor = 'not-allowed'
      spkBtn.title = 'Speaker switching isn\'t supported in this browser'
      spkBtn.addEventListener('click', () => {
        showToast('Not supported on this browser')
      })
      return
    }

    let speakerDeviceId = null   // resolved lazily on first click
    let onSpeaker = false
    let switching = false

    async function findSpeakerDevice(){
      const devices = await navigator.mediaDevices.enumerateDevices()
      const outputs = devices.filter(d => d.kind === 'audiooutput')
      // Prefer a device explicitly labeled as a speaker (common on Android/Windows)
      const bySpeaker = outputs.find(d => /speaker/i.test(d.label))
      if(bySpeaker) return bySpeaker.deviceId
      // Otherwise fall back to any non-default output (e.g. built-in speakers vs headset)
      const nonDefault = outputs.find(d => d.deviceId !== 'default' && d.deviceId !== '')
      return nonDefault ? nonDefault.deviceId : null
    }

    spkBtn.addEventListener('click', async () => {
      if(switching) return
      switching = true
      try {
        if(!onSpeaker){
          if(speakerDeviceId === null) speakerDeviceId = await findSpeakerDevice()
          if(!speakerDeviceId){
            showToast('No alternate output device found')
            switching = false
            return
          }
          await remoteAudio.setSinkId(speakerDeviceId)
          onSpeaker = true
        } else {
          await remoteAudio.setSinkId('')   // back to default output
          onSpeaker = false
        }
        spkBtn.classList.toggle('on', onSpeaker)
        spkLbl.textContent = onSpeaker ? 'On' : 'Speaker'
      } catch(e){
        console.error('[Wavr] setSinkId failed:', e)
        showToast('Could not switch output device')
      }
      switching = false
    })
  })()

  // ── END CALL ──
  async function doEnd(){
    clearCallTimeout()
    clearInterval(timerInterval); waveRunning=false
    await logCall('completed')
    endCall()
    sessionStorage.clear()
    gsap.to(['.call-center','.controls'],{opacity:0,y:30,duration:.4,onComplete:()=>window.location.href='app.html'})
  }
  document.getElementById('end-btn').addEventListener('click', doEnd)

  document.getElementById('back-btn').addEventListener('click', e=>{
    if(confirm('Leave this call?')){ doEnd() }
  })

  // ── LOG CALL ──
  // For outgoing: I am caller, peerAddress is callee
  // For incoming: peer is caller, I am callee — calls.php sets caller=session(me)
  //   so for incoming we must not log from our side (peer/caller will log it)
  //   We only log our own outgoing calls to avoid duplicate entries
  async function logCall(status='completed'){
    if(direction === 'incoming' && status === 'completed') return // caller logs it
    try {
      await fetch('/api/calls.php', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
        body: JSON.stringify({ callee_address: peerAddress, status, duration: timerSec })
      })
    } catch(e){}
  }

  // ── INIT SIGNALING + WEBRTC ──
  let callTimeout = null

  // 30-second timeout if peer never answers
  function startCallTimeout(){
    callTimeout = setTimeout(async () => {
      await logCall('missed')
      showToast('No answer')
      endCall()
      sessionStorage.clear()
      setTimeout(() => window.location.href = 'app.html', 1200)
    }, 30000)
  }

  function clearCallTimeout(){
    if(callTimeout){ clearTimeout(callTimeout); callTimeout = null }
  }

  initSignaling(myAddress, token, {
    onConnected: () => {
      clearCallTimeout()
      onConnected()
    },
    onCallEnded: ()=>{
      clearCallTimeout()
      clearInterval(timerInterval); waveRunning=false
      showToast('Call ended')
      setTimeout(()=>window.location.href='app.html',1100)
    },
    onCallDeclined: async ()=>{
      clearCallTimeout()
      await logCall('declined')
      showToast('Call declined')
      endCall()
      sessionStorage.clear()
      gsap.to(['.call-center','.controls'],{opacity:0,y:20,duration:.35,
        onComplete:()=>window.location.href='app.html'})
    }
  })

  if(direction==='incoming' && savedOffer){
    answerCall(peerAddress, JSON.parse(savedOffer))
  } else {
    startCall(peerAddress)
    startCallTimeout()
  }

  function showToast(msg){
    const c=document.getElementById('toasts'),t=document.createElement('div')
    t.className='toast'; t.innerHTML=`<div class="t-dot"></div><span>${msg}</span>`
    c.appendChild(t); setTimeout(()=>t.remove(),2200)
  }
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(e=>console.warn("SW:",e))}</script>
</body>
</html>
